name: finvu_authentication_sdk
description: "Silent Network Authentication for Finvu Account Aggregator flows. Verifies a mobile number over the carrier network, with no OTP, on Android and iOS."
version: 1.0.1
homepage: https://github.com/Cookiejar-technologies/finvu-auth-sdk-flutter-implementation
repository: https://github.com/Cookiejar-technologies/finvu-auth-sdk-flutter-implementation
issue_tracker: https://github.com/Cookiejar-technologies/finvu-auth-sdk-flutter-implementation/issues

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: 26.0.1 # pinned: generated files must match the checked-in output

flutter:
  plugin:
    platforms:
      android:
        package: com.finvu.finvu_auth_sdk
        pluginClass: FinvuAuthSdkPlugin
      ios:
        pluginClass: FinvuAuthSdkPlugin


